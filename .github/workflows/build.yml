name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Run unit tests
        run: gradle -p "$GITHUB_WORKSPACE" testDebugUnitTest --no-daemon --stacktrace

      - name: Restore signing keystore
        env:
          ZIP_PASSWORD: ${{ secrets.SIGNING_ZIP_PASSWORD }}
        run: |
          unzip -o -P "$ZIP_PASSWORD" app/signing/powerdebug.keystore.zip -d app/signing/
          test -f app/signing/powerdebug.keystore

      - name: Build Debug APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle -p "$GITHUB_WORKSPACE" clean assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: power-debug-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
